cj:
  # departments that are services or non-merchandise, not shopping-basket items
  drop_departments: [FUEL, COUPON, MISCELLANEOUS, POSTAL CENTER, PROD-WHS SALES, GM MERCH EXP,
                     AUTOMOTIVE, PHOTO & VIDEO, CNTRL/STORE SUP, TOYS, ELECT &PLUMBING,
                     GARDEN CENTER, TRAVEL & LEISURE, RESTAURANT]
  split_date: "2017-07-01"     # first half vs second half for RQ5
rules:
  min_pair_baskets: 10          # pairs seen in fewer baskets are not ranked
  fdr: 0.05
  staple_top_share: 0.05        # top 5% of items by prevalence count as staples
  min_purchases_rq3: 4          # histories shorter than this are not classified

# ---- Milestone 3: modeling and evaluation -------------------------------------------------
m3:
  periods:                      # fit on the past, tune on Q3, test once on Q4 (2017)
    fit_start: "2017-01-01"
    fit_end:   "2017-07-01"     # January to June: fit everything for tuning
    tune_end:  "2017-10-01"     # July to September: tuning and C3 training queries
    test_end:  "2018-01-02"     # October to December: final test, touched once
  swap_samples: 30              # swap-randomized samples per period (M2 used 40 on the full year)
  k: 10                         # length of a recommendation list
  bootstrap: 1000               # paired household bootstrap resamples
  staple_grid: [0.05, 0.10]     # staple cutoffs computed per window; 0.05 (M2 definition) is used
  c1_grid:                      # association rules (FP-Growth)
    min_support: [0.002, 0.005, 0.01]
    min_confidence: [0.05, 0.10, 0.20]
  c2_grid:                      # null-calibrated naive Bayes recommender
    measure: [strength, ebgm]
    prior_weight: [0.0, 0.5, 1.0]
    clip: [true, false]
  c3:                           # LightGBM LambdaMART hybrid
    trials: 10
    train_queries: 15000
    candidates: 50
  rq3:
    min_purchases: 4
    horizon_days: 91
  rq4:
    nmf_k: [6, 8, 10, 12, 15]
  promo:
    pairs_per_group: 150
    stores: 112                 # every store with promotion records
