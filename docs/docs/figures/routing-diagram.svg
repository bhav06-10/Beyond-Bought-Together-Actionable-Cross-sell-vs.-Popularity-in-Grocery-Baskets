
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Routing an association to its intervention">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- edges -->
  <line x1="300" y1="76"  x2="300" y2="116" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="152" x2="536" y2="152" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="184" x2="300" y2="246" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="282" x2="536" y2="282" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="314" x2="300" y2="376" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="412" x2="536" y2="412" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="444" x2="300" y2="506" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <text x="492" y="146" font-size="13" fill="#6a7887">No</text>
  <text x="308" y="218" font-size="13" fill="#6a7887">Yes</text>
  <text x="492" y="276" font-size="13" fill="#6a7887">Yes</text>
  <text x="308" y="348" font-size="13" fill="#6a7887">No</text>
  <text x="492" y="406" font-size="13" fill="#6a7887">Yes</text>
  <text x="308" y="478" font-size="13" fill="#6a7887">No</text>

  <!-- start -->
  <rect x="130" y="20" width="340" height="56" rx="8" fill="#0f1b2b"/>
  <text x="300" y="53" font-size="15" fill="#ffffff" text-anchor="middle">Any co-purchase association</text>

  <!-- decision 1 -->
  <rect x="130" y="120" width="340" height="64" rx="8" fill="#cfb87c"/>
  <text x="300" y="157" font-size="14" fill="#182333" text-anchor="middle">Strong under a null-invariant measure?</text>

  <!-- popularity -->
  <rect x="540" y="124" width="300" height="56" rx="8" fill="#e7e9ec" stroke="#c2c8d0" stroke-width="1"/>
  <text x="690" y="147" font-size="14" fill="#3a4654" text-anchor="middle">Popularity co-occurrence</text>
  <text x="690" y="166" font-size="14" fill="#3a4654" text-anchor="middle">&#8594; no nudge</text>

  <!-- decision 2 -->
  <rect x="130" y="250" width="340" height="64" rx="8" fill="#cfb87c"/>
  <text x="300" y="287" font-size="14" fill="#182333" text-anchor="middle">Same item recurring on a regular interval?</text>

  <!-- replenishment -->
  <rect x="540" y="254" width="300" height="56" rx="8" fill="#ffffff" stroke="#0f1b2b" stroke-width="2"/>
  <text x="690" y="277" font-size="14" fill="#182333" text-anchor="middle">Replenishment</text>
  <text x="690" y="296" font-size="14" fill="#182333" text-anchor="middle">&#8594; timed reminder</text>

  <!-- decision 3 -->
  <rect x="130" y="380" width="340" height="64" rx="8" fill="#cfb87c"/>
  <text x="300" y="417" font-size="14" fill="#182333" text-anchor="middle">Pattern spans separate visits?</text>

  <!-- sequential -->
  <rect x="540" y="384" width="300" height="56" rx="8" fill="#ffffff" stroke="#0f1b2b" stroke-width="2"/>
  <text x="690" y="407" font-size="14" fill="#182333" text-anchor="middle">Sequential cross-sell</text>
  <text x="690" y="426" font-size="14" fill="#182333" text-anchor="middle">&#8594; next-trip nudge</text>

  <!-- actionable -->
  <rect x="130" y="510" width="340" height="64" rx="8" fill="#0f1b2b"/>
  <text x="300" y="538" font-size="14.5" fill="#ffffff" text-anchor="middle">Actionable cross-sell</text>
  <text x="300" y="558" font-size="14.5" fill="#ffffff" text-anchor="middle">&#8594; bundle or adjacency</text>
</svg>
